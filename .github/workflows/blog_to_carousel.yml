name: Carrossel a partir de artigo novo do blog

on:
  schedule:
    - cron: "0 21 * * *"   # todo dia as 18h de Brasilia
  workflow_dispatch:
    inputs:
      post_url:
        description: "Opcional: link de um artigo do blog para processar agora (mesmo que ja processado)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: blog-to-carousel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Node.js (para o Claude Code CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Instalar Chromium do Playwright (renderizador dos slides)
        run: python -m playwright install --with-deps chromium

      - name: Pre-aprovar diretorio para o Claude Code
        run: |
          python3 -c "
          import json, os
          path = os.path.expanduser('~/.claude.json')
          cwd = os.environ['GITHUB_WORKSPACE']
          data = {}
          if os.path.exists(path):
              with open(path) as f:
                  data = json.load(f)
          for d in (cwd, os.path.join(cwd, 'scripts')):
              data.setdefault('projects', {})[d] = {'hasTrustDialogAccepted': True}
          with open(path, 'w') as f:
              json.dump(data, f)
          "

      - name: Gerar, revisar e publicar
        env:
          FORCE_POST_URL: ${{ github.event.inputs.post_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          INSTAGRAM_ACCOUNTS_JSON: ${{ secrets.INSTAGRAM_ACCOUNTS_JSON }}
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
        working-directory: scripts
        run: python blog_to_carousel.py

      - name: Salvar estado e rascunhos no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git add drafts/ state/
            git commit -m "Blog -> carrossel: execucao $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nada para commitar"
            if git pull --rebase origin main && git push origin main; then
              echo "push ok"
              break
            fi
            echo "Push falhou, tentando novamente ($i)..."
            sleep $((RANDOM % 8 + 2))
          done
